[project]
name = "entropy-age"
version = "0.1.0"
description = "Aging clocks from accumulating stochastic variation (Meyer & Schumacher 2024), reimplemented with uv/polars, extended to gene- and cell-type-specific stochasticity under selection"
authors = [
    { name = "antonkulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "typer>=0.28.0",
]

[project.scripts]
entropy-age = "entropy_age.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
