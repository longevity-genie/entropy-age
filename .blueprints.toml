# entropy-age's seats (the seats kit, agent-seat-blueprints; docs/DECISIONS.md D3). Committed: it declares
# the seats and holds no key. The messenger accounts stay on each machine, in its pool.
[repo]
# Also the name of the repository's channel in the Zulip organisation, and the id the desk registers it under.
id = "entropy-age"

# The lead (docs/seats/LEAD.md): owns docs/ROADMAP.md and builds it with the maintainer.
[seat.lead]
# The organisation desk's secretary relays the maintainer's answers to the lead's questions: a wake, never
# an instruction (the kit's D83). There is no other seat here to hand it work.
wake_from = "*/secretary"

[seat.lead.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The plan's items that need the lead (the kit's D116): no state or owner, a date come, a blocked item with
# no desk question, a desk question answered. Each said once.
[seat.lead.watch.plan]
cmd = "sh kit:bin/py.sh kit:classes/lead/plan-watch.py"

# The desk's answers to this seat's questions, each said once (the kit's D133).
[seat.lead.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py entropy-age lead"
